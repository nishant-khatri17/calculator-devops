# Whole stack:  docker compose up -d
#   nginx (port 9090)  ->  calculator (port 8080, internal only)
name: calculator-devops   # same project name wherever it runs (laptop or Jenkins workspace)

services:
  calculator:
    # Jenkins sets DOCKERHUB_USER and IMAGE_TAG; the defaults make a plain
    # "docker compose up" work on any machine by building the image locally.
    image: ${DOCKERHUB_USER:-local}/calculator-api:${IMAGE_TAG:-latest}
    build: .
    environment:
      PORT: "8080"
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"   # let the JVM size its heap from the container limit
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - calc-net

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "9090:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      calculator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - calc-net

networks:
  calc-net:
    driver: bridge
