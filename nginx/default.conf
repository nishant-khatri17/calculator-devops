server {
    listen 80;

    # Docker's internal DNS. Re-resolving the name every few seconds means nginx
    # keeps working when the calculator container is recreated with a new IP.
    resolver 127.0.0.11 valid=5s;

    location / {
        set $upstream http://calculator:8080;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 3s;
    }
}
